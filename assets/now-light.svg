<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img"><rect width="840" height="360" rx="6" fill="#F3EFE6"/><text x="40" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#6E685D" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="1.6" >CURRENTLY BUILDING</text><line x1="420" y1="70" x2="420" y2="326" stroke="#CEC6B6" stroke-width="1"/><text x="40" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >Legal AI assistant</text><text x="40" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >An agent for Turkish law. It reads a case</text><text x="40" y="149" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >file, pulls related court decisions and</text><text x="40" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >constitutional articles, and helps a lawyer</text><text x="40" y="191" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >decide what to do next.</text><circle cx="52" cy="248" r="5" fill="#1C1B18"/><text x="52" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#6E685D" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" >case.pdf</text><line x1="59" y1="248" x2="127" y2="248" stroke="#1C1B18" stroke-width="1"/><circle cx="134" cy="248" r="5" fill="#1C1B18"/><text x="134" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#6E685D" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" >split</text><line x1="141" y1="248" x2="209" y2="248" stroke="#1C1B18" stroke-width="1"/><circle cx="216" cy="248" r="5" fill="#1C1B18"/><text x="216" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#6E685D" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" >pgvector</text><line x1="223" y1="248" x2="291" y2="248" stroke="#1C1B18" stroke-width="1"/><circle cx="298" cy="248" r="5" fill="#D4501E"/><text x="298" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#6E685D" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" >agents</text><line x1="305" y1="248" x2="373" y2="248" stroke="#1C1B18" stroke-width="1"/><circle cx="380" cy="248" r="5" fill="#1C1B18"/><text x="380" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#6E685D" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" >petition</text><text x="298" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#D4501E" font-weight="normal" font-style="normal" text-anchor="middle" letter-spacing="0" >gpt · claude · gemini</text><text x="40" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6E685D" font-weight="normal" font-style="italic" text-anchor="start" letter-spacing="0" >Tested with a lawyer on real case files.</text><text x="450" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >Anatomicana</text><text x="450" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >An anatomy learning app. I model the</text><text x="450" y="149" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >anatomy in 3D myself, with a muscle and</text><text x="450" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >bone library, and I'm now working on</text><text x="450" y="191" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#1C1B18" font-weight="normal" font-style="normal" text-anchor="start" letter-spacing="0" >dissection-level detail.</text><circle cx="640" cy="262" r="46" fill="none" stroke="#1C1B18" stroke-width="1.1"/><ellipse cx="640" cy="262" rx="15.180000000000001" ry="46" fill="none" stroke="#CEC6B6" stroke-width="1"/><ellipse cx="640" cy="262" rx="46" ry="15.180000000000001" fill="none" stroke="#CEC6B6" stroke-width="1"/><ellipse cx="640" cy="262" rx="30.360000000000003" ry="46" fill="none" stroke="#CEC6B6" stroke-width="1"/><ellipse cx="640" cy="262" rx="46" ry="30.360000000000003" fill="none" stroke="#CEC6B6" stroke-width="1"/><line x1="594" y1="262" x2="686" y2="262" stroke="#CEC6B6" stroke-width="1"/><line x1="640" y1="216" x2="640" y2="308" stroke="#CEC6B6" stroke-width="1"/><circle cx="670.36" cy="236.7" r="3" fill="#D4501E"/><circle cx="624.82" cy="290.52" r="3" fill="#D4501E"/><circle cx="649.2" cy="271.2" r="3" fill="#D4501E"/><text x="450" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#6E685D" font-weight="normal" font-style="italic" text-anchor="start" letter-spacing="0" >Smooth on a phone is the hard part.</text></svg>